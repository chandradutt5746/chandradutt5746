<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Chandradutt Patel - Software Engineer and Cryptography Builder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 44px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 2px; }
    .role { font: 500 18px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9fb3d9; letter-spacing: 4px; }
    .tags { font: 400 15px 'Courier New', monospace; fill: #6f86b8; }
    .blk  { fill: url(#accent); }
    .lbl  { font: 600 11px 'Courier New', monospace; fill: #6f86b8; letter-spacing: 2px; }
    .flow { animation: dash 2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  </style>
  <rect width="900" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="15" fill="none" stroke="#25305a"/>

  <text x="450" y="95" text-anchor="middle" class="name">CHANDRADUTT PATEL</text>
  <text x="450" y="130" text-anchor="middle" class="role">SOFTWARE ENGINEER · BUILDER</text>

  <!-- pipeline: data -> ciphertext -> compute -> result -->
  <g transform="translate(150,175)">
    <rect x="0" y="0" width="90" height="44" rx="8" fill="none" stroke="#00d9ff" stroke-width="1.5"/>
    <text x="45" y="27" text-anchor="middle" class="lbl">DATA</text>

    <line x1="90" y1="22" x2="170" y2="22" stroke="#00d9ff" stroke-width="2" stroke-dasharray="8 4" class="flow"/>

    <g>
      <rect x="170" y="8" width="16" height="28" rx="3" class="blk pulse"/>
      <rect x="192" y="8" width="16" height="28" rx="3" class="blk pulse" style="animation-delay:.3s"/>
      <rect x="214" y="8" width="16" height="28" rx="3" class="blk pulse" style="animation-delay:.6s"/>
      <rect x="236" y="8" width="16" height="28" rx="3" class="blk pulse" style="animation-delay:.9s"/>
      <rect x="258" y="8" width="16" height="28" rx="3" class="blk pulse" style="animation-delay:1.2s"/>
    </g>
    <text x="222" y="62" text-anchor="middle" class="lbl">CIPHERTEXT</text>

    <line x1="274" y1="22" x2="354" y2="22" stroke="#7c5cff" stroke-width="2" stroke-dasharray="8 4" class="flow"/>

    <rect x="354" y="0" width="130" height="44" rx="8" fill="none" stroke="#7c5cff" stroke-width="1.5"/>
    <text x="419" y="27" text-anchor="middle" class="lbl">COMPUTE</text>

    <line x1="484" y1="22" x2="564" y2="22" stroke="#7c5cff" stroke-width="2" stroke-dasharray="8 4" class="flow"/>

    <rect x="564" y="0" width="90" height="44" rx="8" fill="none" stroke="#00d9ff" stroke-width="1.5"/>
    <text x="609" y="27" text-anchor="middle" class="lbl">RESULT</text>
  </g>

  <text x="450" y="270" text-anchor="middle" class="tags">Python · C++ · Cloud · Data · Cryptography</text>
</svg>
