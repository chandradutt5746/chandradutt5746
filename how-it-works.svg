<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="How homomorphic encryption works: encrypt, compute on ciphertext, decrypt" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b34"/>
    </linearGradient>
  </defs>
  <style>
    .t  { font: 700 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
    .s  { font: 400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9fb3d9; }
    .n  { font: 700 12px 'Courier New', monospace; fill: #00d9ff; letter-spacing: 2px; }
    .flow { animation: dash 2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
  </style>
  <rect width="900" height="240" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="238" rx="15" fill="none" stroke="#25305a"/>

  <!-- step 1 -->
  <rect x="40" y="50" width="220" height="130" rx="12" fill="none" stroke="#00d9ff" stroke-width="1.5"/>
  <text x="60" y="80" class="n">01</text>
  <text x="60" y="110" class="t">Encrypt</text>
  <text x="60" y="134" class="s">Data is encrypted on the</text>
  <text x="60" y="152" class="s">owner's side. Keys stay put.</text>

  <line x1="260" y1="115" x2="340" y2="115" stroke="#00d9ff" stroke-width="2" stroke-dasharray="8 4" class="flow"/>

  <!-- step 2 -->
  <rect x="340" y="50" width="220" height="130" rx="12" fill="none" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="360" y="80" class="n" style="fill:#a78bfa">02</text>
  <text x="360" y="110" class="t">Compute on ciphertext</text>
  <text x="360" y="134" class="s">Analytics or ML run without</text>
  <text x="360" y="152" class="s">ever seeing the raw data.</text>

  <line x1="560" y1="115" x2="640" y2="115" stroke="#7c5cff" stroke-width="2" stroke-dasharray="8 4" class="flow"/>

  <!-- step 3 -->
  <rect x="640" y="50" width="220" height="130" rx="12" fill="none" stroke="#00d9ff" stroke-width="1.5"/>
  <text x="660" y="80" class="n">03</text>
  <text x="660" y="110" class="t">Decrypt the result</text>
  <text x="660" y="134" class="s">Only the key holder can read</text>
  <text x="660" y="152" class="s">the private answer.</text>
</svg>
